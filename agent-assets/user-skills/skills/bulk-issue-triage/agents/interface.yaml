interface:
  display_name: "Bulk Issue Triage"
  short_description: "批量问题证据化初查、共享根因识别与复杂度分包"
  default_prompt: "使用 $bulk-issue-triage 对这批问题做证据化初步核查，按领域、共享根因与修复复杂度整理为问题包；默认用中文输出 Markdown，并附上交给 agent-orchestration-planner 的推荐使用方法。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"

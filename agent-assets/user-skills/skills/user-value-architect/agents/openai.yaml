  short_description: "探索用户可感知价值的上限机会"
  default_prompt: "使用 $user-value-architect 分析项目的用户可感知价值上限；默认用中文交付报告、候选方向、验证路线、最终回复和 HTML UI 文案；agent active 自启用只做低预算轻量诊断、coverage debt 和 handoff 建议，用户显式调用才进入正式 Deep，Exhaustive 仅在用户明确要求时进入。"

policy:
  allow_implicit_invocation: true

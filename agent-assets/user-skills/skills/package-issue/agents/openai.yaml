interface:
  display_name: "Package Issue"
  short_description: "结合仓库证据形成高内聚问题包，核查修复价值并明确下一处理路径"
  default_prompt: "使用 $package-issue 对这批问题做 repo-backed 初查，并用中文输出；保留必要技术术语、代码/命令/文件名、状态字段和原文证据。先给决策摘要，再用稳定 Evidence ID 核查每包是否值得修复，按共享修改边界、验证边界和依赖闭包整理为高内聚、低耦合的问题包，并为每包指定 next_route。"

policy:
  allow_implicit_invocation: false

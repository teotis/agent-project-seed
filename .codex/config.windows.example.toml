# Codex user config example for Windows.
#
# Codex configuration normally lives outside the repository in:
#
#   %USERPROFILE%\.codex\config.toml
#
# Copy the notify line below into that file and replace the path with this
# repository's absolute Windows path after copying/initializing the scaffold.

notify = [
  "py",
  "-3",
  "C:\\absolute\\path\\to\\project\\tools\\hooks\\codex_notify.py"
]
